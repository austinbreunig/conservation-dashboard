name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against the project's own conventions in CLAUDE.md,
            spec/architecture.md, and spec/tasks.md (read them first). Focus on:

            1. Correctness — does it actually satisfy the task's "done when"
               criteria, or does it look done without being verified?
            2. Scope creep — does it stay within the task it claims to address?
            3. Test coverage for the changed behavior.
            4. Anything that silently mocks/stubs a real external dependency
               (GCS, DuckDB httpfs, live data sources) without saying so.

            Use inline comments for specific issues, a top-level comment for
            overall assessment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
