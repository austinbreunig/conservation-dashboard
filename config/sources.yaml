# Source adapter configuration (T1.2, architecture Section 5.1/6.1/6.2).
#
# Each entry under `sources:` is consumed by one SourceAdapter instance
# (src/acquisition/). Adding a new county-sourced layer means adding a new
# entry here, not new code (FR-1.3, NFR-7) -- the ArcGISRestAdapter class
# (src/acquisition/arcgis_rest.py) is generic and parameterized entirely by
# these fields.
#
# Schema (per entry):
#   name           Unique source id; matches SourceAdapter.name and is
#                   stamped onto every normalized record as `source_name`
#                   (architecture 2.5, FR-1.7/NFR-11 provenance tracking).
#   source_type    "real" | "synthetic" -- stamped onto every normalized
#                   record as `source_type`. All ArcGIS REST sources below
#                   are "real" (FR-1.5). The synthetic moose-sightings
#                   adapter (src/acquisition/synthetic.py) is not
#                   config-driven -- see that module -- so it has no entry
#                   here.
#   adapter        Which adapter class consumes this entry. "arcgis_rest"
#                   -> src.acquisition.arcgis_rest.ArcGISRestAdapter.
#                   "static_file" -> src.acquisition.static_file.
#                   StaticFileAdapter, for the one source (county
#                   boundary) that has no live endpoint at all.
#   service_url    Base ArcGIS REST FeatureServer/MapServer *service* URL
#                   (no trailing slash, no /query, no layer id) -- e.g.
#                   ".../FeatureServer" or ".../MapServer". The adapter
#                   builds the actual query endpoint as
#                   "<service_url>/<layer_id>/query" (architecture 6.2).
#                   Not present on `adapter: static_file` entries -- they
#                   have no live endpoint to query.
#   layer_id       Integer layer id within the service. Not present on
#                   `adapter: static_file` entries.
#   local_fixture  Repo-relative path to an already-downloaded GeoJSON
#                   snapshot of this source. For `adapter: arcgis_rest`
#                   entries this is a dev/offline fallback used only when
#                   the live portal is unreachable (data/raw/ is
#                   git-ignored -- see .gitignore -- so this path may not
#                   exist in every checkout; src/pipeline/run.py handles
#                   that case); NOTE: these local snapshots were
#                   downloaded with every field present, so they may be a
#                   superset of whatever `outfields` (below) requests from
#                   the live portal -- that's expected/safe, not a bug,
#                   since `outfields` only restricts the live fetch, not
#                   the fixture. For the `adapter: static_file` entry,
#                   this is instead the *only* copy of the data -- see
#                   that entry's notes and the Dockerfile.
#   outfields      Optional list of field names to request from the layer
#                   (passed through to ArcGISRestAdapter's `outfields`
#                   constructor arg, joined into a comma-separated
#                   `outFields` query param). Keeps per-source fields
#                   flexible without adapter code changes (NFR-7). When
#                   absent, the adapter requests every field (`outFields=*`).
#   notes          Free text; used below to record what T1.7's live
#                   investigation did/didn't confirm for this specific
#                   entry.
#
# Access model (confirmed 2026-07-24 via a live query against the real
# portal for 3 of these 4 layers -- see
# docs/decisions/arcgis-rest-access-model.md for the full T1.7 write-up):
# anonymous read access, no API key required; standard ArcGIS REST
# resultOffset/resultRecordCount pagination; maxRecordCount discoverable
# per-layer via a "<layer_url>?f=json" metadata GET.

sources:
  - name: boco_trailheads
    source_type: real
    adapter: arcgis_rest
    service_url: https://maps.bouldercounty.org/arcgis/rest/services/ParksOpenSpace/OP_BCPOS_TRAILHEADS/MapServer
    layer_id: 0
    local_fixture: data/raw/boco_trailheads.geojson
    outfields: [TrailheadName, Location, LocationDescription]
    notes: >
      Confirmed live 2026-07-24 (T1.7/T1.8): anonymous access, 38
      features, maxRecordCount=1000, schema/feature-count parity with
      data/raw/boco_trailheads.geojson within a small documented drift
      tolerance (see docs/decisions/arcgis-rest-access-model.md).

  - name: boco_trailsegs
    source_type: real
    adapter: arcgis_rest
    service_url: https://amsagsprod1-bouldercounty.msappproxy.net/server/rest/services/POS/TrailsDissolve/FeatureServer
    layer_id: 0
    local_fixture: data/raw/boco_trailsegs.geojson
    outfields: [TRAILNAME, TRAILSYSTEM, TRAILTYPE]
    notes: >
      Confirmed live 2026-07-27 (completes T1.2/T1.7's follow-up item):
      anonymous access, 130 features, maxRecordCount=2000, schema/field
      list (TRAILNAME, TRAILID, TRAILSYSTEM, TRAILTYPE, BIKES,
      ELECTRICBIKE, DOGS, HORSES, PARKGROUP) matches
      data/raw/boco_trailsegs.geojson's actual attributes -- 1-feature
      drift vs. the 129-feature fixture, the same small documented-drift
      pattern as boco_trailheads above. Note this endpoint is served from
      amsagsprod1-bouldercounty.msappproxy.net (an Azure AD App Proxy
      host), a different portal domain than the other three entries here
      (maps.bouldercounty.org) -- not just a different path. An earlier
      candidate URL (`POS/Trails/FeatureServer`, no "Dissolve") was ruled
      out before this note was written: it is a different, broader
      362-feature trails layer with an incompatible schema (a `MILEAGE`
      field instead of this layer's `TRAILID`/`TRAILSYSTEM`/etc) -- use
      `POS/TrailsDissolve`, not `POS/Trails`.
      Re-validated live end-to-end 2026-08-01 (T2.1): `ArcGISRestAdapter.
      fetch()` against this exact config entry returns 130 features
      (LineString/MultiLineString), same field list plus a few
      ArcGIS-system columns (ObjectID, Shape__Length, Difficulty,
      TotalLengthFt, TotalLengthMiles) expected from `outFields=*` -- see
      tests/acquisition/test_arcgis_rest.py's parametrized T2.1 live
      smoke tests. `outfields` narrowed to [TRAILNAME, TRAILSYSTEM,
      TRAILTYPE] per PR #14 review (2026-08-02): the fuller 9-field list
      above was what the live endpoint carries, not what this project
      needs downstream, so both the live query and
      config/schema_manifest.yaml's expected schema are narrowed
      together, matching the other four ArcGIS entries' existing
      narrow-`outfields` pattern.

  - name: boco_critical_wildlife_habitats
    source_type: real
    adapter: arcgis_rest
    service_url: https://maps.bouldercounty.org/arcgis/rest/services/PLANNING/BCCP_CriticalWildlifeHabitats/MapServer
    layer_id: 0
    local_fixture: data/raw/boco_critical_wildlife_habitats.geojson
    outfields: [Name, Description, Acres]
    notes: >
      Confirmed live 2026-07-24 (T1.7): anonymous access, 77 features,
      maxRecordCount=1000, matches data/raw/boco_critical_wildlife_habitats.geojson's
      feature count exactly. Feeds its own proximity scoring input
      (dist_habitat_m, W_HABITAT) -- architecture 2.4/5.1, not merged with
      wildlife corridors below.
      Re-validated live end-to-end 2026-08-01 (T2.1): still 77 features
      (Polygon/MultiPolygon), fields exactly [Name, Description, Acres].

  - name: boco_wildlife_corridors
    source_type: real
    adapter: arcgis_rest
    service_url: https://maps.bouldercounty.org/arcgis/rest/services/PLANNING/BCCP_WildlifeMigrationCorridors/FeatureServer
    layer_id: 0
    local_fixture: data/raw/boco_wildlife_corridors.geojson
    outfields: [Name, Description, Acres]
    notes: >
      Confirmed live 2026-07-24 (T1.7): anonymous access, 3 features,
      maxRecordCount=2000, matches data/raw/boco_wildlife_corridors.geojson's
      feature count exactly. Feeds its own proximity scoring input
      (dist_corridor_m, W_CORRIDOR) -- architecture 2.4/5.1, distinct from
      critical wildlife habitats above.
      Re-validated live end-to-end 2026-08-01 (T2.1): still 3 features
      (Polygon), fields exactly [Name, Description, Acres].

  - name: boco_county_roads
    source_type: real
    adapter: arcgis_rest
    service_url: https://amsagsprod1-bouldercounty.msappproxy.net/server/rest/services/PW/genRoad_Map_Roads/FeatureServer
    layer_id: 0
    local_fixture: data/raw/boco_county_roads.geojson
    outfields: [PAVETYPE, STREET_NAME, CR]
    notes: >
      Confirmed live 2026-07-27: anonymous access, 2,748 features,
      maxRecordCount=2000, same amsagsprod1-bouldercounty.msappproxy.net
      Azure AD App Proxy portal domain as boco_trailsegs above (not
      maps.bouldercounty.org). Resolves T2.2's consultant action item
      ("acquire county-roads GeoJSON or confirm live FeatureServer layer
      id/URL") -- a fixture (data/raw/boco_county_roads.geojson, downloaded
      via `f=geojson` with resultOffset pagination against this layer's
      maxRecordCount=2000) is also now present, so T2.2/T2.3 are fully
      unblocked, not just URL-confirmed. `outfields` (PAVETYPE,
      STREET_NAME, CR) is the consultant-specified field list, confirmed
      to exist on the live schema.

  - name: boco_county_boundary
    source_type: real
    adapter: static_file
    local_fixture: data/raw/boco_county_boundary.geojson
    notes: >
      Acquired 2026-08-02 (unblocks spec/tasks.md T3.2's source-config
      half; the grid-clip half of T3.2 is still Refinement-tagged/not
      done here). Per PR #14 review: this layer is static (a single
      county-boundary polygon that doesn't change run to run), not
      config-driven ArcGIS REST like the other five real sources -- it
      has no `service_url`/`layer_id`, only a `local_fixture`, and is
      fetched via the new `adapter: static_file`
      (src/acquisition/static_file.py's `StaticFileAdapter`) rather than
      `ArcGISRestAdapter`. Unlike every other entry's `local_fixture`
      (a dev/offline fallback only -- data/raw/ is git-ignored, so
      production relies on the live portal), this is the *only* copy in
      production too: there is no live endpoint to fall back from, so
      the Dockerfile explicitly `COPY`s this one file into the image
      (see Dockerfile's own comment) even though data/raw/ is otherwise
      excluded from both git and the image.
