[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conservation-dashboard"
version = "0.1.0"
description = "Weekly-refreshing restoration-priority dashboard for a Boulder County, CO conservation nonprofit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Austin Breunig" }]
keywords = ["gis", "geospatial", "conservation", "dashboard", "duckdb", "geopandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "duckdb>=0.10",
    "pyyaml>=6.0",
    "streamlit>=1.32",
    "folium>=0.15",
    "pydeck>=0.8",
    "requests>=2.31",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "gcsfs>=2024.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/austinbreunig/conservation-dashboard"
Repository = "https://github.com/austinbreunig/conservation-dashboard"
Issues = "https://github.com/austinbreunig/conservation-dashboard/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "src/acquisition",
    "src/etl",
    "src/scoring",
    "src/pipeline",
    "src/dashboard",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
